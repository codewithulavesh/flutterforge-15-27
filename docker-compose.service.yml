# Service-grade deployment overlay: FlutterForge + PostgreSQL + MinIO.
#
#   docker compose -f docker-compose.yml -f docker-compose.service.yml --profile service up --build
#
# Boot sequence (as composed): postgres applies storage/migrations.postgres.sql
# on first start via the postgres image's initdb hook; MinIO provisions the
# `flutterforge` bucket from the minio/mc container; the app boots with
# FLUTTERFORGE_PLATFORM_DB_DRIVER=postgres and FLUTTERFORGE_PLATFORM_MIGRATIONS=none.
#
# This is a reference topology, not a TLS boundary — put TLS termination and
# an auth gateway (host LB / Caddy / nginx+ModSecurity) in front of the app.

version: "3.8"

services:
  postgres:
    image: postgres:17-alpine
    profiles:
      - service
    container_name: flutterforge-postgres
    environment:
      POSTGRES_DB: flutterforge
      POSTGRES_USER: flutterforge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_in_prod}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./server/platform/storage/migrations.postgres.sql:/docker-entrypoint-initdb.d/0001_init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flutterforge -d flutterforge"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    mem_limit: 1g
    cpus: 2.0

  minio:
    image: minio/minio:latest
    profiles:
      - service
    container_name: flutterforge-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-flutterforge}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-changeme_in_prod_too}
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0

  minio-init:
    image: minio/mc:latest
    profiles:
      - service
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-flutterforge} $${MINIO_ROOT_PASSWORD:-changeme_in_prod_too}
        mc mb -p local/flutterforge
        mc anonymous set download local/flutterforge/releases || true
      "
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flutterforge-service
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "8787:8787"
    environment:
      HOST: 0.0.0.0
      PORT: "8787"
      FLUTTERFORGE_DATA_DIR: /data/.flutterforge
      FLUTTERFORGE_PLATFORM_DB_DRIVER: postgres
      FLUTTERFORGE_PLATFORM_DB_PG_URL: postgresql://flutterforge:${POSTGRES_PASSWORD:-changeme_in_prod}@postgres:5432/flutterforge
      FLUTTERFORGE_VAULT_KEY: ${FLUTTERFORGE_VAULT_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      FLUTTERFORGE_ALLOW_REMOTE: "1"
      # The service-grade gateway requires explicit opt-in to anonymous remote
      # access; prefer your LB/upstream to gate access.
    volumes:
      - flutterforge-data:/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 2g
    cpus: 2.0
    profiles:
      - service

volumes:
  postgres-data:
  minio-data:
  flutterforge-data:
    name: flutterforge-service-data
