[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "VITE_PREVIEW_API_URL"

# ── Single Page Application (SPA) fallback ─────────────────────────
# The generation engine and preview server run on the user's machine (or the
# Electron app). They must never be exposed through a hardcoded public tunnel:
# point VITE_PREVIEW_API_URL at your own engine and allow this origin via
# FLUTTERFORGE_ALLOWED_ORIGINS instead.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
